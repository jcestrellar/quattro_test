plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'quattro.app'
    compileSdk 36

    defaultConfig {
        applicationId 'jp.co.roland.quattro.android'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    flavorDimensions 'functions'
    productFlavors {
        basic {
            dimension 'functions'
        }
        billing {
            dimension 'functions'
        }
    }
    sourceSets {
        main {
            java.srcDir "../../../../quattro2/android/main/java"
            jniLibs.srcDir "src/main/libs"
        }
        basic {
            java.srcDir "../../../../quattro2/android/basic/java"
        }
        billing {
            java.srcDirs "../../../../quattro2/android/billing/java"
        }
    }
    externalNativeBuild {
        cmake {
            path './CMakeLists.txt'
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.browser:browser:1.9.0'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'

    billingImplementation "com.android.billingclient:billing:7.1.1"
}